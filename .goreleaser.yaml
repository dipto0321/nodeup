# GoReleaser v2 configuration for nodeup.
#
# Inputs (from environment):
#   GITHUB_TOKEN           — provided by GitHub Actions
#   HOMEBREW_TAP_TOKEN     — provided by GitHub Actions (per-repo secret)
#   SCOOP_BUCKET_TOKEN     — provided by GitHub Actions (per-repo secret)
#
# Outputs:
#   - 5 single-binary archives in dist/ (windows/arm64 is intentionally
#     excluded by the builds[].ignore block — add later if demanded):
#       nodeup_<version>_linux_amd64.tar.gz
#       nodeup_<version>_linux_arm64.tar.gz
#       nodeup_<version>_darwin_amd64.tar.gz
#       nodeup_<version>_darwin_arm64.tar.gz
#       nodeup_<version>_windows_amd64.zip
#   - checksums.txt with SHA256 for every artifact (the 6th release
#     file, but it's a checksums manifest, not a binary)
#   - A GitHub Release titled `v<version>` with changelog and all artifacts
#   - A homebrew cask pushed to github.com/dipto0321/homebrew-tap
#   - A scoop manifest pushed to github.com/dipto0321/scoop-bucket

version: 2

project_name: nodeup

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: nodeup
    main: ./cmd/nodeup
    binary: nodeup
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # The ldflags live in the dedicated `ldflags` key, NOT in `flags`.
    #
    # GoReleaser has its own default ldflags (`-s -w -X main.version=... -X
    # main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser`)
    # and it only applies them when `builds[].ldflags` is empty. Passing
    # `-ldflags=...` through `flags` instead produced two `-ldflags`
    # arguments on the `go build` command line — Go took the last one, so
    # our `-X main.commit={{.ShortCommit}} -X main.date={{.CommitDate}}`
    # was silently dropped and the shipped binary reported GoReleaser's
    # defaults instead (a full 40-char commit and the build date rather
    # than the commit date). GoReleaser also logs "ldflags is defined
    # twice" to warn about exactly this.
    #
    # Using `ldflags:` keeps a single, explicit ldflags argument and
    # preserves the short-commit / commit-date metadata we want.
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.CommitDate}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64 # windows/arm64 is rare; add later if demanded
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    # `formats` (plural, list form) replaced the deprecated singular
    # `format` in GoReleaser v2.6. The archive names are unchanged —
    # `nodeup_<version>_<os>_<arch>.tar.gz` — which is what the npm
    # wrapper's archiveName() and the Homebrew/Scoop manifests expect.
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'
      - '^ci:'
      - '^style:'
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug fixes
      regexp: '^fix'
      order: 1
    - title: Performance
      regexp: '^perf'
      order: 2
    - title: Refactors
      regexp: '^refactor'
      order: 3
    - title: Others
      order: 999

# Homebrew tap — auto-pushed on every release. Requires HOMEBREW_TAP_TOKEN.
#
# GoReleaser deprecated the `brews:` (formula) section in v2.10 in favour of
# `homebrew_casks:`. A formula's `install:` block is raw Ruby; a cask's
# `binary:` stanza is declarative, and Homebrew now prefers casks for
# "download a binary and put it on PATH" distributions.
#
# `brew install dipto0321/tap/nodeup` keeps working after the switch — we
# verified the formula→cask transition against a scratch tap: Homebrew
# detects the change on `brew update`, installs the cask, unlinks the old
# keg, and tells the user to `brew uninstall --formula --force nodeup`.
# The tap repo carries a `tap_migrations.json` mapping so Homebrew can
# perform that hand-off automatically.
homebrew_casks:
  - name: nodeup
    repository:
      owner: dipto0321
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    homepage: 'https://github.com/dipto0321/nodeup'
    description: 'Automated Node.js version upgrade with global package migration'
    license: 'MIT'
    binaries:
      - nodeup
    # Strip the macOS Gatekeeper quarantine attribute after install.
    #
    # Homebrew quarantines every artifact it downloads (Cask::Quarantine
    # .cask! in Homebrew's source) and propagates the attribute to the
    # files it extracts. nodeup ships as an unsigned Go binary, so a
    # quarantined copy cannot be executed at all: macOS's kernel kills
    # the process with
    #
    #   ASP: Security policy would not allow process: <pid>, <path>
    #
    # before main() ever runs — `nodeup version` just dies. Removing
    # `com.apple.quarantine` is the remedy Homebrew's own cask guidance
    # recommends (and what GoReleaser's cask docs point at).
    #
    # The hook runs `xattr -dr` on the staged path so it covers the
    # extracted binary. `on_macos` keeps it a no-op on Linux. The `run`
    # step is not `must_succeed`-critical: if xattr is unavailable the
    # install should still complete rather than abort.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"], must_succeed: false
          end

# Scoop bucket — auto-pushed on every release. Requires SCOOP_BUCKET_TOKEN.
scoops:
  - repository:
      owner: dipto0321
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_TOKEN }}'
    homepage: 'https://github.com/dipto0321/nodeup'
    description: 'Automated Node.js version upgrade with global package migration'
    license: MIT

# Sign the binaries with cosign if COSIGN_KEY is set in the environment.
# Disabled by default — uncomment to enable.
